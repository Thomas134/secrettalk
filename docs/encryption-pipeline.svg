<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"
     font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5b74"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b06a1f"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d6d"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#23324d" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f4f7fb"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#16233a">文本 / 录音 / 图片 / 文件 · 加密流水线</text>
  <text x="40" y="80" font-size="13" fill="#5b6b82">四种载荷共用同一条端到端加密通道；视频按「文件」发送（接收端为下载），中继只看到 base64 密文与元数据</text>

  <!-- 列标题 -->
  <text x="40" y="116" font-size="14" font-weight="700" fill="#1c3fa8">① 采集与规整（浏览器内）</text>
  <text x="420" y="116" font-size="14" font-weight="700" fill="#1c3fa8">② 明文信封 + 加密</text>
  <text x="840" y="116" font-size="14" font-weight="700" fill="#1c3fa8">③ 一分两路：密文 / 密钥</text>
  <text x="1260" y="116" font-size="14" font-weight="700" fill="#1c3fa8">④ 中继与接收端</text>

  <!-- ① 输入卡片 -->
  <g filter="url(#s)">
    <rect x="40" y="134" width="320" height="86" rx="12" fill="#ffffff" stroke="#cfd9ea"/>
  </g>
  <text x="58" y="160" font-size="14" font-weight="700" fill="#1c3fa8">文本</text>
  <text x="58" y="182" font-size="11.5" fill="#4b5b74">输入框文字，可作为附件配文</text>
  <text x="58" y="200" font-size="11.5" fill="#4b5b74">空文本时也可以只发附件</text>

  <g filter="url(#s)">
    <rect x="40" y="232" width="320" height="96" rx="12" fill="#ffffff" stroke="#cfd9ea"/>
  </g>
  <text x="58" y="258" font-size="14" font-weight="700" fill="#1c3fa8">录音</text>
  <text x="58" y="280" font-size="11.5" fill="#4b5b74">MediaRecorder → webm/opus</text>
  <text x="58" y="298" font-size="11.5" fill="#4b5b74">最长 60 秒，到时自动停止并发送</text>
  <text x="58" y="316" font-size="11" fill="#6b7a92">需要麦克风权限（https / localhost）</text>

  <g filter="url(#s)">
    <rect x="40" y="340" width="320" height="96" rx="12" fill="#ffffff" stroke="#cfd9ea"/>
  </g>
  <text x="58" y="366" font-size="14" font-weight="700" fill="#1c3fa8">图片</text>
  <text x="58" y="388" font-size="11.5" fill="#4b5b74">&gt;1.2MB 先压到 1600px / JPEG 0.82</text>
  <text x="58" y="406" font-size="11.5" fill="#4b5b74">压缩后仍 &gt;4MB 则拒绝发送</text>
  <text x="58" y="424" font-size="11" fill="#6b7a92">透明区域填白，避免转 JPEG 变黑</text>

  <g filter="url(#s)">
    <rect x="40" y="448" width="320" height="96" rx="12" fill="#ffffff" stroke="#cfd9ea"/>
  </g>
  <text x="58" y="474" font-size="14" font-weight="700" fill="#1c3fa8">文件 · 视频</text>
  <text x="58" y="496" font-size="11.5" fill="#4b5b74">任意文件 ≤ 4MB</text>
  <text x="58" y="514" font-size="11.5" fill="#4b5b74">视频走这里：接收端为下载链接</text>
  <text x="58" y="532" font-size="11" fill="#a05a1f">当前没有独立「视频」入口和内嵌播放器</text>

  <text x="40" y="580" font-size="11" fill="#6b7a92">所有解析/压缩/录音都在浏览器内存完成，不上传原文件</text>

  <!-- ① → ② -->
  <path d="M 362 300 L 412 300" stroke="#4b5b74" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="368" y="288" font-size="10.5" fill="#4b5b74">字节</text>

  <!-- ② 信封 -->
  <g filter="url(#s)">
    <rect x="420" y="134" width="380" height="206" rx="12" fill="#f8faff" stroke="#dbe3f6"/>
  </g>
  <text x="438" y="160" font-size="13" font-weight="700" fill="#1c3fa8">明文 JSON（序列化成字节后整体加密）</text>
  <text x="438" y="188" font-size="10.5" fill="#3d4f6d" font-family="Consolas, monospace">{</text>
  <text x="438" y="206" font-size="10.5" fill="#3d4f6d" font-family="Consolas, monospace">  magic, messageId, roomId, from, ts,</text>
  <text x="438" y="224" font-size="10.5" fill="#3d4f6d" font-family="Consolas, monospace">  text: "配文",</text>
  <text x="438" y="242" font-size="10.5" fill="#3d4f6d" font-family="Consolas, monospace">  attachment: { kind, name, mime, size,</text>
  <text x="438" y="260" font-size="10.5" fill="#3d4f6d" font-family="Consolas, monospace">                data: "base64(原始字节)" }</text>
  <text x="438" y="278" font-size="10.5" fill="#3d4f6d" font-family="Consolas, monospace">}</text>
  <text x="438" y="304" font-size="11" fill="#6b7a92">纯文本消息没有 attachment 字段</text>
  <text x="438" y="322" font-size="11" fill="#6b7a92">文件名 / mime / 大小 / 音频字节都在密文里</text>

  <!-- ② AES -->
  <path d="M 610 342 L 610 356" stroke="#4b5b74" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="420" y="360" width="380" height="150" rx="12" fill="#fff8ec" stroke="#efcf9a"/>
  </g>
  <text x="438" y="388" font-size="13" font-weight="700" fill="#8a5310">AES-256-GCM（每条消息新 msgKey）</text>
  <text x="438" y="412" font-size="11.5" fill="#6d5220">IV：12 字节随机（每条消息不同）</text>
  <text x="438" y="432" font-size="11.5" fill="#6d5220">AAD：roomId | messageId</text>
  <text x="438" y="452" font-size="11.5" fill="#6d5220">加密对象：整个 JSON（含附件 base64）</text>
  <text x="438" y="472" font-size="11.5" fill="#6d5220">输出：ciphertext + 16 字节认证标签</text>
  <text x="438" y="494" font-size="11" fill="#a05a1f">改一个字节都会校验失败，不会输出错误明文</text>

  <!-- ② 底部：msgKey 与 KEK 说明 -->
  <path d="M 610 532 L 610 514" stroke="#b06a1f" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <g filter="url(#s)">
    <rect x="420" y="536" width="380" height="54" rx="12" fill="#fff4f2" stroke="#e8b9ae"/>
  </g>
  <text x="438" y="562" font-size="12.5" font-weight="700" fill="#a03a2b">msgKey：每条消息全新 32 字节随机</text>
  <text x="438" y="580" font-size="10.5" fill="#8a5a50">加密完立即 0 覆写，永不完整上网</text>

  <g filter="url(#s)">
    <rect x="420" y="610" width="380" height="94" rx="12" fill="#e8f2ec" stroke="#bcd9c7"/>
  </g>
  <text x="438" y="636" font-size="12.5" font-weight="700" fill="#2f6b48">KEK 从哪来？</text>
  <text x="438" y="658" font-size="11" fill="#3d5f58">ECDH P-256 私钥 + 对方公钥 → 共享秘密</text>
  <text x="438" y="678" font-size="11" fill="#3d5f58">HKDF-SHA256(roomId) → KEK（32 字节）</text>
  <text x="438" y="696" font-size="11" fill="#3d5f58">只在两端内存，从不上网；退出即销毁</text>

  <!-- ③ 密文分支 -->
  <path d="M 800 400 L 836 400" stroke="#4b5b74" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="804" y="388" font-size="10.5" fill="#4b5b74">ciphertext</text>

  <g filter="url(#s)">
    <rect x="840" y="360" width="380" height="100" rx="12" fill="#eef3ff" stroke="#c6d5ff"/>
  </g>
  <text x="858" y="386" font-size="13" font-weight="700" fill="#1c3fa8">ciphertext（整段密文）</text>
  <text x="858" y="408" font-size="11" fill="#3d4f6d">文本 / 语音 / 图片 / 文件全在里面</text>
  <text x="858" y="428" font-size="11" fill="#3d4f6d">复制 5 份，5 台中继各存一份相同密文</text>
  <text x="858" y="448" font-size="11" fill="#3d4f6d">中继看不到字段边界，更看不到内容</text>

  <!-- ③ 密钥分支 -->
  <path d="M 800 563 L 836 563" stroke="#b06a1f" stroke-width="2.2" fill="none" marker-end="url(#ao)"/>
  <text x="800" y="551" font-size="10.5" fill="#b06a1f">msgKey</text>
  <g filter="url(#s)">
    <rect x="840" y="536" width="380" height="54" rx="12" fill="#fff4f2" stroke="#e8b9ae"/>
  </g>
  <text x="858" y="562" font-size="12.5" font-weight="700" fill="#a03a2b">Shamir SSS(3,5) → 5 个碎片</text>
  <text x="858" y="580" font-size="10.5" fill="#8a5a50">任意 3 片可还原；2 片信息量为零</text>

  <path d="M 1030 590 L 1030 602" stroke="#b06a1f" stroke-width="2.2" fill="none" marker-end="url(#ao)"/>
  <g filter="url(#s)">
    <rect x="840" y="606" width="380" height="74" rx="12" fill="#fff8ec" stroke="#efcf9a"/>
  </g>
  <text x="858" y="632" font-size="12.5" font-weight="700" fill="#8a5310">每个碎片再用 KEK 单独加密</text>
  <text x="858" y="652" font-size="11" fill="#6d5220">独立 IV + AAD = roomId|messageId|碎片下标</text>
  <text x="858" y="670" font-size="11" fill="#6d5220">→ encryptedShare（各 49 字节含 tag）</text>

  <!-- ③ → ④ -->
  <path d="M 1220 408 L 1238 408 L 1238 470 L 1254 470" stroke="#2f7d6d" stroke-width="2.2" fill="none" marker-end="url(#at)"/>
  <text x="1226" y="396" font-size="10" fill="#2f7d6d">5 份</text>
  <path d="M 1220 643 L 1238 643 L 1238 560 L 1254 560" stroke="#b06a1f" stroke-width="2.2" fill="none" marker-end="url(#ao)"/>
  <text x="1226" y="658" font-size="10" fill="#b06a1f">×5</text>

  <!-- ④ 中继可见性 -->
  <g filter="url(#s)">
    <rect x="1260" y="134" width="300" height="200" rx="12" fill="#ffffff" stroke="#cfd9ea"/>
  </g>
  <text x="1278" y="160" font-size="13" font-weight="700" fill="#1c3fa8">中继 / 网关 / Cloudflare</text>
  <text x="1278" y="184" font-size="11" fill="#2f6b48">能看到：</text>
  <text x="1278" y="204" font-size="10.5" fill="#4b5b74">roomId、messageId、from、</text>
  <text x="1278" y="222" font-size="10.5" fill="#4b5b74">碎片下标、密文长度、时间、IP</text>
  <text x="1278" y="250" font-size="11" fill="#a03a2b">看不到：</text>
  <text x="1278" y="270" font-size="10.5" fill="#4b5b74">明文、msgKey、KEK、</text>
  <text x="1278" y="288" font-size="10.5" fill="#4b5b74">ECDH 私钥、文件名与 mime</text>
  <text x="1278" y="318" font-size="10.5" fill="#6b7a92">（文件名/mime 在密文内部）</text>

  <!-- ④ 中继 -->
  <g filter="url(#s)">
    <rect x="1260" y="360" width="300" height="260" rx="12" fill="#fffdf4" stroke="#e6d3a2"/>
  </g>
  <text x="1278" y="386" font-size="12.5" font-weight="700" fill="#8a6a1f">5 台中继（3001~3005）</text>
  <text x="1278" y="404" font-size="10.5" fill="#a08a55">各存 1 个 encryptedShare + 密文副本</text>
  <g font-size="11">
    <rect x="1276" y="414" width="268" height="34" rx="8" fill="#ffffff" stroke="#e2c98f"/>
    <text x="1290" y="436" fill="#8a5310">3001：碎片 #0 + 密文</text>
    <rect x="1276" y="452" width="268" height="34" rx="8" fill="#ffffff" stroke="#e2c98f"/>
    <text x="1290" y="474" fill="#8a5310">3002：碎片 #1 + 密文</text>
    <rect x="1276" y="490" width="268" height="34" rx="8" fill="#ffffff" stroke="#e2c98f"/>
    <text x="1290" y="512" fill="#8a5310">3003：碎片 #2 + 密文</text>
    <rect x="1276" y="528" width="268" height="34" rx="8" fill="#ffffff" stroke="#e2c98f"/>
    <text x="1290" y="550" fill="#8a5310">3004：碎片 #3 + 密文</text>
    <rect x="1276" y="566" width="268" height="34" rx="8" fill="#ffffff" stroke="#e2c98f"/>
    <text x="1290" y="588" fill="#8a5310">3005：碎片 #4 + 密文</text>
  </g>
  <text x="1278" y="614" font-size="10" fill="#a08a55">TTL 5 分钟 · 无 crypto 模块</text>

  <!-- ④ 接收端 -->
  <path d="M 1410 610 L 1410 644" stroke="#b06a1f" stroke-width="2.2" fill="none" marker-end="url(#ao)"/>
  <g filter="url(#s)">
    <rect x="1260" y="650" width="300" height="220" rx="12" fill="#ffffff" stroke="#cfd9ea"/>
  </g>
  <text x="1278" y="676" font-size="12.5" font-weight="700" fill="#1c3fa8">接收端重组 + 展示</text>
  <text x="1278" y="698" font-size="10.5" fill="#4b5b74">① 收任意 3 个 encryptedShare</text>
  <text x="1278" y="716" font-size="10.5" fill="#4b5b74">② 用 KEK 解密 → 3 段碎片</text>
  <text x="1278" y="734" font-size="10.5" fill="#4b5b74">③ combine → msgKey</text>
  <text x="1278" y="752" font-size="10.5" fill="#4b5b74">④ AES-GCM 解整段 JSON</text>
  <text x="1278" y="770" font-size="10.5" fill="#4b5b74">⑤ 取 attachment.data 拼 data URL</text>
  <text x="1278" y="788" font-size="10.5" fill="#4b5b74">⑥ 渲染 / 播放 / 下载</text>
  <text x="1278" y="816" font-size="10.5" fill="#2f6b48">文本：气泡 · 音频：&lt;audio&gt;</text>
  <text x="1278" y="834" font-size="10.5" fill="#2f6b48">图片：&lt;img&gt; · 文件/视频：下载</text>

  <!-- 底部 -->
  <g filter="url(#s)">
    <rect x="40" y="930" width="1520" height="46" rx="12" fill="#ffffff" stroke="#d7e1f0"/>
  </g>
  <text x="60" y="950" font-size="11" fill="#4b5b74">加密边界在两端浏览器：中继 / 网关 / Cloudflare 只能看到 base64 密文与元数据；明文、msgKey、KEK、ECDH 私钥从不离开浏览器。</text>
  <text x="60" y="966" font-size="11" fill="#4b5b74">限制：附件 ≤4MB（图片先压缩）· 语音 ≤60 秒 · 每条消息独立 msgKey · 附件密文在 5 台各存一份（不是拆分）· 退出即 0 覆写。</text>
</svg>
